name: Docker Build and Push

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "版本标签 (例如: v1.0.0)"
        required: false
        type: string
        default: ""
      include_latest:
        description: "latest标签"
        required: false
        type: boolean
        default: true

  # 新增 push 触发器，确保每次代码合并到 main 分支后自动构建
  push:
    branches:
      - main
    tags:
      - "v*" # 当推送 v 开头的 Git Tag 时也触发

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME 变量保持不变，在步骤中精确构造 GHCR 路径

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # 保持 contents: read，但我们将依赖 GHCR_PAT 来写入 packages
      contents: read
      # packages: write 保持，但 PAT 拥有更高的优先级

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 必须获取完整的 Git 历史，才能正确提取 Tag 和 SHA
          fetch-depth: 0

      # 新增步骤：将 GitHub 用户名转换为小写 (Ricky-Yz -> ricky-yz)
      - name: 设置小写用户名变量
        id: vars
        run: |
          echo "DOCKER_USER=$(echo ${{ github.actor }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.vars.outputs.DOCKER_USER }}
          # 使用您的 Secret 来替换 GITHUB_TOKEN，解决权限问题
          password: ${{ secrets.GHCR_PAT }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            # 构造 GHCR 镜像路径：ghcr.io/ricky-yz/MoonTV
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.DOCKER_USER }}/${{ github.event.repository.name }}
          tags: |

            # 1. 版本保留：基于 Git Tag（例如 v1.0.0），仅在推送 Tag 时触发
            type=ref,event=tag

            # 2. 自动化最新标签：如果推送到 main 分支，则打上 :latest 标签
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

            # 3. 保留手动输入的版本标签（如果使用 workflow_dispatch 触发）
            ${{ inputs.version_tag != '' && format('type=raw,value={0}', inputs.version_tag) || '' }}
          flavor: |
            latest=false

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像信息
        run: |
          echo "### 🐳 Docker镜像构建成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像仓库地址：** ghcr.io/${{ steps.vars.outputs.DOCKER_USER }}/${{ github.event.repository.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**镜像标签：**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.version_tag }}" ]; then
            echo "**版本标签：** ${{ inputs.version_tag }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.include_latest }}" == "true" ]; then
            echo "**包含latest标签：** 是" >> $GITHUB_STEP_SUMMARY
          else
            echo "**包含latest标签：** 否" >> $GITHUB_STEP_SUMMARY
          fi
